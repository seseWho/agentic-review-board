name: agentic-review-board

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.8.5}
    container_name: arb-vllm
    init: true
    gpus: all
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    shm_size: "8gb"
    stop_grace_period: 2m
    volumes:
      - ${HF_HOME:-huggingface-cache}:/root/.cache/huggingface
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen3-4B-AWQ}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-qwen3-4b-awq}
      - --quantization
      - awq_marlin
      - --dtype
      - half
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-40960}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      - --kv-cache-dtype
      - ${VLLM_KV_CACHE_DTYPE:-auto}
      - --max-num-seqs
      - "1"
      - --enable-prefix-caching
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5).read()"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30m

volumes:
  huggingface-cache:
    name: agentic-review-board-huggingface-cache
